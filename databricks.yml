bundle:
  name: self-help-langgraph-agent

variables:
  experiment_name:
    default: /Shared/self_help_agent_ci
  uc_model_name:
    default: main.ai_agents.self_help_langgraph_agent
  endpoint_name:
    default: self-help-agent-prod

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    self_help_agent_eval_register:
      name: self-help-agent-eval-register-${bundle.target}
      tasks:
        - task_key: eval_register
          spark_python_task:
            python_file: ../scripts/log_eval_register.py
            parameters:
              - --git-sha
              - ${bundle.git.commit}
              - --branch
              - ${bundle.git.branch}
              - --eval-dataset
              - ../eval/eval_dataset.jsonl
              - --register-on-pass
              - "true"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - -r ../requirements.txt
